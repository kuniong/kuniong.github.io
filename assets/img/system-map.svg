<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" role="img" aria-labelledby="title desc">
  <title id="title">Abstract operations research system diagram</title>
  <desc id="desc">Demand and supply streams flow through queues, decisions and an optimization loop.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#173f3a" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f5a50"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="618" height="498" rx="26" fill="#fffdf8" stroke="#d8d3c8"/>
  <rect x="26" y="26" width="568" height="448" rx="20" fill="url(#grid)"/>

  <text x="52" y="72" fill="#66736f" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.8">STOCHASTIC SYSTEM</text>

  <g fill="none" stroke="#1f5a50" stroke-width="2.4" marker-end="url(#arrow)">
    <path d="M110 150 C185 150, 190 220, 260 220"/>
    <path d="M110 350 C185 350, 190 280, 260 280"/>
    <path d="M358 250 C420 250, 434 170, 502 170"/>
    <path d="M358 250 C420 250, 434 330, 502 330"/>
  </g>

  <g>
    <text x="60" y="121" fill="#132a26" font-family="Georgia, serif" font-size="22">Demand</text>
    <circle cx="76" cy="150" r="11" fill="#b85c2d"/>
    <circle cx="108" cy="150" r="11" fill="#e8b99f"/>
    <circle cx="140" cy="150" r="11" fill="#f1dfd2" stroke="#b85c2d"/>
    <text x="60" y="388" fill="#132a26" font-family="Georgia, serif" font-size="22">Supply</text>
    <circle cx="76" cy="350" r="11" fill="#1f5a50"/>
    <circle cx="108" cy="350" r="11" fill="#89afa8"/>
    <circle cx="140" cy="350" r="11" fill="#dce8e4" stroke="#1f5a50"/>
  </g>

  <g>
    <rect x="250" y="184" width="120" height="132" rx="24" fill="#132a26"/>
    <text x="310" y="227" text-anchor="middle" fill="#f4f1e9" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.6">STATE</text>
    <text x="310" y="258" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="28">x(t)</text>
    <text x="310" y="289" text-anchor="middle" fill="#b8c8c4" font-family="Arial, sans-serif" font-size="12">queue • behavior • capacity</text>
  </g>

  <g>
    <rect x="487" y="124" width="84" height="92" rx="18" fill="#dce8e4" stroke="#1f5a50"/>
    <text x="529" y="160" text-anchor="middle" fill="#1f5a50" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.2">POLICY</text>
    <path d="M511 182h36M529 164v36" stroke="#1f5a50" stroke-width="2"/>

    <rect x="487" y="284" width="84" height="92" rx="18" fill="#f1dfd2" stroke="#b85c2d"/>
    <text x="529" y="320" text-anchor="middle" fill="#8e4320" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.2">OUTCOME</text>
    <path d="M507 349l15-13 12 8 17-22" fill="none" stroke="#b85c2d" stroke-width="2.5"/>
  </g>

  <path d="M529 216 C578 240, 578 260, 529 284" fill="none" stroke="#b85c2d" stroke-width="2.4" stroke-dasharray="5 6"/>
  <text x="560" y="255" fill="#66736f" font-family="Arial, sans-serif" font-size="11" transform="rotate(90 560 255)">FEEDBACK</text>

  <g fill="#132a26">
    <circle cx="200" cy="114" r="4"/>
    <circle cx="218" cy="99" r="3" opacity=".55"/>
    <circle cx="401" cy="400" r="5"/>
    <circle cx="424" cy="417" r="3" opacity=".5"/>
  </g>
</svg>
